name: CI
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    name: Test (Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: ["20.19.0", "22.12.0", "26.12.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
      - run: npm ci
      - run: npm install --prefix examples/basic-express
      - run: npm test
      - run: npm run test:types
      - run: npm run lint
      - run: npm audit --audit-level=high

  package-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20.19.0", "22.12.0", "26.12.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
      - run: npm ci
      - run: npm run test:package

  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.0
          cache: "npm"
      - run: npm ci
      - run: cd examples/basic-express && npm install
      - run: cd examples/basic-express && node --check server.js
      - run: node --test test/example-smoke.test.js

  docker-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.0
          cache: "npm"
      - run: npm ci
      - name: Pull Docker integration image
        run: docker pull nginx:alpine
      - name: Run Docker candidate integration test
        env:
          UPDATEPILOT_DOCKER_INTEGRATION: "1"
          UPDATEPILOT_DOCKER_TEST_IMAGE: nginx:alpine
        run: node --test test/integration/docker-handoff.test.js
      - name: Remove and verify integration containers
        if: always()
        shell: bash
        run: |
          remaining="$(docker ps -aq --filter 'name=^/updatepilot-handoff-')"
          if [[ -n "$remaining" ]]; then
            docker rm -f $remaining
            echo "::error::Found leftover UpdatePilot Docker integration containers; they were removed."
            exit 1
          fi
