<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UpdatePilot Admin</title>
    <style>
      :root {
        color-scheme: dark;
        --page: #101413;
        --panel: #191f1d;
        --line: #303936;
        --text: #edf2ef;
        --muted: #9caaa3;
        --green: #67d49a;
        --green-dark: #193d2d;
        --red: #ff9a91;
        --red-bg: #3a211f;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(ellipse at 15% 0%, #24342d 0, transparent 42%),
          var(--page);
        color: var(--text);
        font:
          15px/1.5 system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      main {
        width: min(940px, calc(100% - 32px));
        margin: 48px auto;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 20px;
        margin-bottom: 26px;
      }
      h1 {
        margin: 0;
        font-size: 30px;
      }
      header p {
        margin: 6px 0 0;
        color: var(--muted);
      }
      .version {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-bottom: 18px;
      }
      .metric,
      .output {
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 8px;
      }
      .metric {
        padding: 18px;
        min-height: 100px;
      }
      .metric span {
        display: block;
        color: var(--muted);
        font-size: 13px;
      }
      .metric strong {
        display: block;
        margin-top: 7px;
        font-size: 17px;
        overflow-wrap: anywhere;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        padding: 14px 0 20px;
      }
      button {
        min-height: 42px;
        padding: 0 16px;
        border: 1px solid #53615a;
        border-radius: 6px;
        background: #252e2a;
        color: var(--text);
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        border-color: var(--green);
      }
      button:disabled {
        opacity: 0.46;
        cursor: not-allowed;
      }
      #deploy {
        background: var(--green-dark);
        border-color: #3b825f;
      }
      #deploy.ready {
        background: #246843;
        border-color: var(--green);
      }
      .output {
        padding: 18px;
        min-height: 160px;
      }
      .output-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }
      h2 {
        margin: 0;
        font-size: 16px;
      }
      #spinner {
        display: none;
        width: 18px;
        height: 18px;
        border: 2px solid #51615a;
        border-top-color: var(--green);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .busy #spinner {
        display: block;
      }
      pre {
        margin: 0;
        color: #c9d6ce;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font:
          13px/1.55 ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
      }
      #error {
        display: none;
        margin: 0 0 14px;
        padding: 12px 14px;
        border: 1px solid #8b4c46;
        border-radius: 6px;
        background: var(--red-bg);
        color: var(--red);
      }
      #error.visible {
        display: block;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (max-width: 640px) {
        main {
          margin: 28px auto;
        }
        header {
          align-items: start;
          flex-direction: column;
        }
        .grid {
          grid-template-columns: 1fr;
        }
        .metric {
          min-height: 78px;
        }
        .actions button {
          flex: 1 1 42%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>UpdatePilot</h1>
          <p>Application update control</p>
        </div>
        <div class="version" id="repo">Loading repository…</div>
      </header>
      <section class="grid" aria-label="Update status">
        <article class="metric">
          <span>Current version</span><strong id="current">—</strong>
        </article>
        <article class="metric">
          <span>Latest version</span><strong id="latest">Not checked</strong>
        </article>
        <article class="metric">
          <span>Update status</span><strong id="status">Idle</strong>
        </article>
      </section>
      <div id="error" role="alert"></div>
      <nav class="actions" aria-label="Update actions">
        <button id="check">Check for Updates</button>
        <button id="deploy" disabled>Deploy Update</button>
        <button id="rollback" disabled>Rollback</button>
      </nav>
      <section class="output" aria-live="polite">
        <div class="output-head">
          <h2>Operation response</h2>
          <span id="spinner" aria-label="Loading"></span>
        </div>
        <pre id="result">Ready.</pre>
      </section>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      let updateAvailable = false;
      async function request(path, method = "GET") {
        document.body.classList.add("busy");
        $("error").classList.remove("visible");
        try {
          const response = await fetch(path, {
            method,
            headers: { Accept: "application/json" },
          });
          const data = await response.json();
          $("result").textContent = JSON.stringify(data, null, 2);
          if (!response.ok)
            throw new Error(
              data.error || `Request failed (${response.status})`,
            );
          return data;
        } catch (error) {
          $("error").textContent = error.message;
          $("error").classList.add("visible");
          return null;
        } finally {
          document.body.classList.remove("busy");
        }
      }
      async function refreshStatus() {
        const state = await request("/api/status");
        if (!state) return;
        $("repo").textContent = state.repo;
        $("current").textContent = state.currentVersion;
        $("status").textContent = state.running
          ? "Update in progress"
          : state.lastResult?.status || "Idle";
        $("rollback").disabled = state.lastResult?.status !== "updated";
      }
      $("check").addEventListener("click", async () => {
        const result = await request("/api/check");
        if (!result) return;
        updateAvailable = result.updateAvailable;
        $("latest").textContent = result.latestVersion ?? "No release yet";
        $("status").textContent = updateAvailable
          ? "Update available"
          : "Up to date";
        $("deploy").disabled = !updateAvailable;
        $("deploy").classList.toggle("ready", updateAvailable);
      });
      $("deploy").addEventListener("click", async () => {
        if (!updateAvailable) return;
        const result = await request("/api/update", "POST");
        if (result) {
          updateAvailable = false;
          $("deploy").disabled = true;
          $("deploy").classList.remove("ready");
          await refreshStatus();
        }
      });
      $("rollback").addEventListener("click", async () => {
        if (await request("/api/rollback", "POST")) await refreshStatus();
      });
      refreshStatus();
    </script>
  </body>
</html>
